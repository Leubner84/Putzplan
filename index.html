<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta property="og:title" content="WG Putzplan Grenadier">
    <meta property="og:description" content="Wer ist diese Woche dran? Hier klicken für die Übersicht!">
    <meta property="og:image" content="https://leubner84.github.io/Putzplan/preview-image.jpg">
    <meta property="og:url" content="https://leubner84.github.io/Putzplan/">
    <meta name="twitter:card" content="summary_large_image">

    <title>WG Putzuhr</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f4f4;
            --paper-yellow: #FFC107;
            --paper-green: #8BC34A;
            --marker-red: #D32F2F;
            --text-color: #3e2723;
            --wheel-size: min(90vw, 420px);
            --font-hand: 'Gochi Hand', cursive;
            --person-radius: 170%; /* Abstand der Namen vom Zentrum */
            --task-font-size: 1rem;
            --person-font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            :root { --wheel-size: 85vw; }
        }

        @media (max-width: 400px) {
            :root {
                --task-font-size: 0.8rem;
                --person-font-size: 1rem;
            }
        }

        body {
            font-family: var(--font-hand);
            background-color: var(--bg-color);
            background-image: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H22v20h-2v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2H0v-2h20v-2H0v-2h20v-2H0v-2h20z" fill="%23e0e0e0" fill-opacity="0.4" fill-rule="evenodd"/%3E%3C/svg%3E');
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto; 
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding-top: 20px;
            margin-bottom: 10px;
            z-index: 10;
            flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }
        .date-display { 
            font-size: 1.1rem; 
            margin-top: 5px; 
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 20px;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
        }

        .wheel-stage {
            position: relative;
            width: var(--wheel-size);
            height: var(--wheel-size);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 30px 0;
            flex-shrink: 0;
            cursor: grab;
            touch-action: none; /* verhindert Scroll beim Drehen */
        }
        .wheel-stage.dragging { cursor: grabbing; }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper-yellow);
            border-radius: 50%;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.2), inset 2px 2px 10px rgba(255,255,255,0.2);
            overflow: visible;
        }

        .deco { position: absolute; opacity: 0.5; pointer-events: none; }
        .deco-star { font-size: 1.2rem; color: var(--marker-red); }
        .deco-line { height: 2px; background: var(--text-color); }

        .task-label {
            position: absolute;
            font-size: var(--task-font-size);
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            width: 110px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            padding: 5px;
            border-radius: 10px;
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 400px) {
            .task-label { width: 90px; }
        }

        .task-label:hover { transform: scale(1.05); }
        .task-label:active { transform: scale(0.95); }

        /* Küche-Label bekommt Unterstreichung */
        .task-label[data-index="0"] {
            font-size: calc(var(--task-font-size) * 1.3);
        }
        .task-label[data-index="0"]::before,
        .task-label[data-index="0"]::after { 
            content: ''; position: absolute; height: 2px; 
            background: var(--marker-red); width: 100%; left: 0; opacity: 0.8;
            pointer-events: none;
        }
        .task-label[data-index="0"]::before { top: 0; } 
        .task-label[data-index="0"]::after { bottom: 0; }

        .inner-wheel {
            position: absolute;
            width: 58%;
            height: 58%;
            background-color: var(--paper-green);
            /* clip-path wird dynamisch per JS gesetzt */
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Transition immer aktiv – Dauer wird per CSS-Variable gesteuert */
        .inner-wheel {
            transition: transform var(--wheel-speed, 0.6s) cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .inner-wheel .person-item {
            transition: transform var(--wheel-speed, 0.6s) cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .inner-line {
            position: absolute;
            width: 1px; height: 45%;
            background: rgba(0,0,0,0.1);
            top: 50%; left: 50%;
            transform-origin: top center;
            z-index: 0;
            pointer-events: none;
        }

        .center-pin {
            position: absolute;
            width: 16px; height: 16px;
            background: #e0e0e0;
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4), inset 2px 2px 5px rgba(255,255,255,1);
            z-index: 20;
            border: 1px solid #aaa;
        }

        .person-item {
            position: absolute;
            font-size: var(--person-font-size);
            font-weight: bold;
            text-align: center;
            top: 50%; left: 50%;
            transform-origin: center center; 
            width: 100px; 
            height: 30px;
            margin-top: -15px; 
            margin-left: -50px;
            z-index: 2;
            pointer-events: none;
        }

        .marker-top {
            position: absolute;
            top: -15px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--marker-red);
            z-index: 30;
            filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.3));
        }

        .controls {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            border: 2px dashed #ccc;
            flex-shrink: 0;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 40px; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px; width: 28px;
            border-radius: 50%;
            background: var(--paper-yellow);
            cursor: pointer;
            margin-top: -12px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            border: 2px solid var(--text-color);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer;
            background: #ccc;
            border-radius: 3px;
        }

        .reset-btn {
            background: var(--paper-yellow);
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            font-family: var(--font-hand);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        .reset-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.15); }

        .kw-big-display {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: var(--marker-red);
        }

        /* --- MODAL (Fix: visibility statt display für animierbare Transitions) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.open {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            width: 85%;
            max-width: 350px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            border: 3px dashed var(--marker-red);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        .modal-title { font-size: 1.6rem; color: var(--marker-red); margin-bottom: 10px; }
        .modal-icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }
        .modal-list { text-align: left; list-style: none; padding: 0; font-size: 1.1rem; }
        .modal-list li { margin-bottom: 8px; padding-left: 20px; position: relative; }
        .modal-list li::before {
            content: '✓'; color: var(--paper-green); position: absolute; left: 0; font-weight: bold;
        }
        .modal-close {
            margin-top: 15px;
            background: #eee; border: none; padding: 10px 30px; border-radius: 20px;
            font-family: var(--font-hand); font-size: 1.1rem; cursor: pointer;
            transition: background 0.2s;
        }
        .modal-close:hover { background: #ddd; }
    </style>
</head>
<body>

    <header>
        <h1>Grenadier WG</h1>
        <div class="date-display" id="dateDisplay">--.-- - --.--</div>
    </header>

    <div class="wheel-stage">
        <div class="marker-top"></div>
        <div class="outer-ring" id="outerRing">
            <div class="deco deco-star" style="top:15%; left:25%;">*</div>
            <div class="deco deco-star" style="top:18%; right:22%;">*</div>
            <div class="deco deco-star" style="bottom:22%; left:32%;">*</div>
            <div class="deco deco-star" style="bottom:28%; right:25%;">*</div>
            <div class="deco deco-line" style="width:25px; top:42%; left:12%; transform:rotate(60deg);"></div>
            <div class="deco deco-line" style="width:35px; bottom:35%; right:12%; transform:rotate(-45deg);"></div>
        </div>
        <div class="inner-wheel" id="innerWheel">
            <div class="center-pin"></div>
        </div>
    </div>

    <div class="controls">
        <span class="kw-big-display" id="kwBig">KW --</span>
        <div class="slider-container">
            <span style="font-size: 1rem;">-10</span>
            <input type="range" id="weekSlider" min="-10" max="10" value="0" step="1">
            <span style="font-size: 1rem;">+10</span>
        </div>
        <button class="reset-btn" id="resetBtn">Zurück zu heute</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="modal-icon" id="modalIcon"></span>
            <div class="modal-title" id="modalTitle"></div>
            <ul class="modal-list" id="modalList"></ul>
            <button class="modal-close" id="modalCloseBtn">Schließen</button>
        </div>
    </div>

    <script>
        // --- TELEGRAM INIT ---
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // =====================================================
        // KONFIGURATION – alles Anpassbare an einer Stelle
        // =====================================================
        const PEOPLE = ["Yumi", "Alex", "Lea", "Leuby", "Micha"];

        const TASKS = [
            { 
                name: "Kitchen", icon: "🍽️", shortLabel: "KITCHEN",
                details: ["Clean stove & oven", "Scrub the sink", "Wipe down counters", "Take out trash", "Check the fridge"] 
            },
            { 
                name: "Floors & Living Room", icon: "🧹", shortLabel: "FLOORS\n+ LIVING RM\n+ PLANTS",
                details: ["Vacuum all floors", "Mop kitchen & bathroom", "Tidy up living room", "Water plants", "Dust surfaces"] 
            },
            { 
                name: "Bathroom Upstairs", icon: "🚽", shortLabel: "BATH\n↑ (UP)",
                details: ["Clean toilet", "Scrub sink", "Clean bathtub/shower", "Wipe mirrors", "Mop floor"] 
            },
            { 
                name: "Bathroom Downstairs", icon: "🚿", shortLabel: "BATH\n↓ (DOWN)",
                details: ["Clean toilet", "Scrub sink", "Scrub shower", "Wipe mirrors", "Mop floor"] 
            },
            { 
                name: "Outside & Glass", icon: "🗑️", shortLabel: "OUTSIDE\n+ TOWELS\n+ GLASS",
                details: ["Take out glass recycling", "Change towels", "Put out trash bins", "Sweep terrace", "Dispose of paper recycling"] 
            }
        ];

        // Referenz: KW1 2026 beginnt am Montag 29.12.2025 (12:00 UTC, DST-sicher)
        const REFERENCE_MONDAY = new Date('2025-12-29T12:00:00Z');
        const MS_PER_WEEK = 7 * 24 * 60 * 60 * 1000;

        // =====================================================
        // DOM-REFERENZEN
        // =====================================================
        const innerWheel   = document.getElementById('innerWheel');
        const outerRing    = document.getElementById('outerRing');
        const slider       = document.getElementById('weekSlider');
        const dateDisplay  = document.getElementById('dateDisplay');
        const kwBig        = document.getElementById('kwBig');
        const resetBtn     = document.getElementById('resetBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle   = document.getElementById('modalTitle');
        const modalIcon    = document.getElementById('modalIcon');
        const modalList    = document.getElementById('modalList');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        let currentOffset = 0;
        const count = PEOPLE.length;
        const sliceAngle = 360 / count;

        // =====================================================
        // DYNAMISCHES SETUP – Fünfeck, Linien, Labels, Personen
        // =====================================================

        /** Erzeugt einen CSS clip-path Polygon-String für n Ecken */
        function generatePolygonPath(n) {
            const points = [];
            for (let i = 0; i < n; i++) {
                // Startwinkel -90° damit erste Spitze oben liegt
                const angle = (i * 360 / n) - 90;
                const rad = angle * Math.PI / 180;
                const x = 50 + 48 * Math.cos(rad);
                const y = 50 + 48 * Math.sin(rad);
                points.push(`${x.toFixed(1)}% ${y.toFixed(1)}%`);
            }
            return `polygon(${points.join(', ')})`;
        }

        function initInnerWheel() {
            // Dynamischer clip-path
            innerWheel.style.clipPath = generatePolygonPath(count);

            // Trennlinien
            for (let i = 0; i < count; i++) {
                const line = document.createElement('div');
                line.className = 'inner-line';
                line.style.transform = `rotate(${i * sliceAngle}deg)`;
                innerWheel.appendChild(line);
            }

            // Personen-Labels
            PEOPLE.forEach((person, i) => {
                const el = document.createElement('div');
                el.className = 'person-item';
                el.textContent = person;
                el.dataset.baseAngle = i * sliceAngle;
                innerWheel.appendChild(el);
            });
        }

        /** Positioniert Task-Labels trigonometrisch um den Outer Ring */
        function initTaskLabels() {
            // Offset: erstes Label oben (270° = -90°), dann im Uhrzeigersinn
            const startAngle = -90;
            const labelRadius = 0.35; // Anteil des Radius (0 = Mitte, 0.5 = Rand)

            TASKS.forEach((task, i) => {
                const el = document.createElement('div');
                el.className = 'task-label';
                el.dataset.index = i;
                el.innerHTML = task.shortLabel.replace(/\n/g, '<br>');

                const angle = startAngle + i * sliceAngle;
                const rad = angle * Math.PI / 180;
                // Prozentuale Position relativ zum Outer Ring
                const x = 50 + labelRadius * 100 * Math.cos(rad);
                const y = 50 + labelRadius * 100 * Math.sin(rad);

                el.style.left = `${x}%`;
                el.style.top = `${y}%`;
                el.style.transform = 'translate(-50%, -50%)';

                el.addEventListener('click', (e) => {
                    // Nicht öffnen wenn gerade gedreht wurde
                    if (wasDragged) { e.preventDefault(); return; }
                    openModal(i);
                });
                outerRing.appendChild(el);
            });
        }

        // =====================================================
        // WOCHEN-BERECHNUNG – eine einzige Quelle der Wahrheit
        // =====================================================

        /**
         * Berechnet Montag der Zielwoche und die Wochen-Differenz zur Referenz.
         * Alles basiert auf REFERENCE_MONDAY – keine doppelte Berechnung.
         */
        function getTargetWeekInfo(weekOffset) {
            // Heute auf Mittag normalisieren (DST-sicher)
            const now = new Date();
            now.setHours(12, 0, 0, 0);

            // Montag der aktuellen Woche finden
            const day = now.getDay(); // 0=So, 1=Mo, ...
            const diffToMonday = day === 0 ? -6 : 1 - day;
            const currentMonday = new Date(now);
            currentMonday.setDate(now.getDate() + diffToMonday);
            currentMonday.setHours(12, 0, 0, 0);

            // Offset anwenden
            const targetMonday = new Date(currentMonday);
            targetMonday.setDate(currentMonday.getDate() + weekOffset * 7);

            // Sonntag dieser Woche
            const targetSunday = new Date(targetMonday);
            targetSunday.setDate(targetMonday.getDate() + 6);

            // Wochen-Differenz zur Referenz (ganzzahlig, DST-safe durch Mittags-Normalisierung)
            const weeksDiff = Math.round(
                (targetMonday.getTime() - REFERENCE_MONDAY.getTime()) / MS_PER_WEEK
            );

            // ISO-Wochennummer ableiten
            const isoInfo = getISOWeekNumber(targetMonday);

            return { targetMonday, targetSunday, weeksDiff, isoWeek: isoInfo.week };
        }

        /** ISO 8601 Wochennummer */
        function getISOWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
            return { week: weekNo, year: d.getUTCFullYear() };
        }

        // =====================================================
        // UPDATE – Rad drehen und Anzeige aktualisieren
        // =====================================================

        function update() {
            const info = getTargetWeekInfo(currentOffset);

            // Anzeige
            kwBig.textContent = `KW ${info.isoWeek}`;
            const opts = { day: '2-digit', month: '2-digit' };
            dateDisplay.textContent = 
                `${info.targetMonday.toLocaleDateString('de-DE', opts)} - ${info.targetSunday.toLocaleDateString('de-DE', opts)}`;

            // Rotation (eine Scheibe pro Woche = sliceAngle Grad)
            const rotationAngle = info.weeksDiff * sliceAngle;
            innerWheel.style.transform = `rotate(${rotationAngle}deg)`;

            // Personen-Text gegenrotieren
            document.querySelectorAll('.person-item').forEach(el => {
                const base = parseFloat(el.dataset.baseAngle);
                el.style.transform = `rotate(${base}deg) translate(0, -${170}%) rotate(${-base - rotationAngle}deg)`;
            });
        }

        // =====================================================
        // EVENT-HANDLING
        // =====================================================

        // Slider: kürzere Transition beim Schieben, längere beim Reset
        function setWheelSpeed(speed) {
            innerWheel.style.setProperty('--wheel-speed', speed);
        }

        slider.addEventListener('mousedown',  () => setWheelSpeed('0.25s'));
        slider.addEventListener('touchstart', () => setWheelSpeed('0.25s'), { passive: true });

        slider.addEventListener('input', () => {
            currentOffset = parseInt(slider.value);
            update();
        });

        function endSlide() {
            setWheelSpeed('0.6s');
        }
        slider.addEventListener('mouseup', endSlide);
        slider.addEventListener('touchend', endSlide);

        resetBtn.addEventListener('click', () => {
            setWheelSpeed('0.6s');
            currentOffset = 0;
            slider.value = 0;
            update();
        });

        // =====================================================
        // DRAG-TO-ROTATE (Maus + Touch)
        // =====================================================
        const wheelStage = document.querySelector('.wheel-stage');
        let isDragging = false;
        let wasDragged = false;
        let dragStartAngle = 0;
        let dragStartOffset = 0;

        /** Winkel in Grad vom Mittelpunkt des Rads zum Pointer */
        function getAngleFromCenter(clientX, clientY) {
            const rect = wheelStage.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
        }

        function dragStart(clientX, clientY) {
            isDragging = true;
            wasDragged = false;
            dragStartAngle = getAngleFromCenter(clientX, clientY);
            dragStartOffset = currentOffset;
            setWheelSpeed('0.15s');
            wheelStage.classList.add('dragging');
        }

        function dragMove(clientX, clientY) {
            if (!isDragging) return;
            const currentAngle = getAngleFromCenter(clientX, clientY);
            let delta = currentAngle - dragStartAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            const weekDelta = Math.round(delta / sliceAngle);
            if (weekDelta !== 0) wasDragged = true;
            const newOffset = dragStartOffset + weekDelta;
            const clamped = Math.max(-10, Math.min(10, newOffset));
            if (clamped !== currentOffset) {
                currentOffset = clamped;
                slider.value = currentOffset;
                update();
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            setWheelSpeed('0.6s');
            wheelStage.classList.remove('dragging');
            // wasDragged wird nach dem nächsten Click-Event zurückgesetzt
            setTimeout(() => { wasDragged = false; }, 50);
        }

        // Mouse Events
        wheelStage.addEventListener('mousedown', (e) => {
            e.preventDefault();
            dragStart(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', dragEnd);

        // Touch Events
        wheelStage.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            dragStart(t.clientX, t.clientY);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const t = e.touches[0];
            dragMove(t.clientX, t.clientY);
        }, { passive: true });
        window.addEventListener('touchend', dragEnd);
        window.addEventListener('touchcancel', dragEnd);

        // --- MODAL ---
        function openModal(index) {
            const task = TASKS[index];
            modalTitle.textContent = task.name;
            modalIcon.textContent = task.icon;
            modalList.innerHTML = '';
            task.details.forEach(detail => {
                const li = document.createElement('li');
                li.textContent = detail;
                modalList.appendChild(li);
            });
            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        modalCloseBtn.addEventListener('click', closeModal);

        // ESC schließt Modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // =====================================================
        // INIT
        // =====================================================
        initInnerWheel();
        initTaskLabels();
        update();
    </script>
</body>
</html>
